<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SignalDesk Backtest: IDEA (DELIVERY)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { color: #38bdf8; margin-bottom: 4px; }
  .badge { display: inline-block; padding: 4px 10px; background: #1e293b; border-radius: 6px; font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; padding: 16px; border-radius: 8px; }
  .card-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
  .card-val { font-size: 22px; font-weight: 700; margin-top: 6px; color: #38bdf8; }
  .card-val.pos { color: #4ade80; }
  .card-val.neg { color: #f87171; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #334155; }
  th { background: #0f172a; color: #94a3b8; font-weight: 600; }
  tr.win td:nth-child(9) { color: #4ade80; font-weight: 600; }
  tr.loss td:nth-child(9) { color: #f87171; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <h1>SignalDesk Quant Report &mdash; IDEA</h1>
  <div class="badge">Pipeline: DELIVERY | Friction: 0.05% Brokerage + 0.05% Slippage</div>
  
  <div class="cards">
    <div class="card"><div class="card-label">Win Rate</div><div class="card-val pos">0.0%</div></div>
    <div class="card"><div class="card-label">Profit Factor</div><div class="card-val">0.00</div></div>
    <div class="card"><div class="card-label">Average RR</div><div class="card-val">1:0.00</div></div>
    <div class="card"><div class="card-label">Net Profit</div><div class="card-val pos">₹0.00 (0.0%)</div></div>
    <div class="card"><div class="card-label">Max Drawdown</div><div class="card-val neg">0.0%</div></div>
    <div class="card"><div class="card-label">Total Trades</div><div class="card-val">0</div></div>
  </div>

  <h2>Trade Log</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Side</th><th>Entry Time</th><th>Entry</th><th>SL</th><th>TP</th><th>Status</th><th>Planned RR</th><th>PnL</th><th>R-Mult</th></tr>
    </thead>
    <tbody>
      <tr><td colspan='10'>No trades formed</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
